[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-management-llm"
version = "0.1.0"
description = "压力管理适配大模型后训练项目"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Project Team"}
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.5",
    "pre-commit>=3.8.0",
]
flash = ["flash-attn>=2.7.0"]
serve = ["vllm>=0.6.3", "sglang>=0.3.2"]

[tool.setuptools.packages.find]
where = ["training", "evaluation", "serving"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
